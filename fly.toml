app = 'nasafilmg3'
primary_region = 'iad'
swap_size_mb = 512

[build]
  dockerfile = 'movie-theater-be/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
