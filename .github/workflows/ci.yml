name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]

jobs:
  backend:
    name: Backend compile & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-theater-be
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile, test and enforce coverage
        run: mvn -B -q verify -DskipITs

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-theater-fe
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: movie-theater-fe/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit test
        run: npm run test:run
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080
