# Development profile — verbose SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: ignore migrations removed after consolidation (R__mission_schema_patches → R__feature_schema_patches)
spring.flyway.ignore-migration-patterns=*:missing

# Roll recently expired showtimes forward when the 48h radar window is empty (local demo only)
app.showtime-radar.repair-demo-showtimes=true

# Local defaults when IDE run does not inject .env (override via env / .env file)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:movie_theater}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Dev-only fallback JWT — replace via APP_JWT_SECRET in any shared/deployed environment
app.jwt.secret=${APP_JWT_SECRET:dev-only-change-me-movie-theater-jwt-secret-32b}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}
app.google.client-id=${GOOGLE_WEB_CLIENT_ID:}

app.auth.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@example.com}
app.auth.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:ChangeMe123!}
app.auth.seed.admin-full-name=${APP_SEED_ADMIN_FULL_NAME:Admin}
app.auth.seed.staff-email=${APP_SEED_STAFF_EMAIL:staff@example.com}
app.auth.seed.staff-password=${APP_SEED_STAFF_PASSWORD:ChangeMe123!}
app.auth.seed.staff-full-name=${APP_SEED_STAFF_FULL_NAME:Staff User}
app.auth.seed.customer-email=${APP_SEED_CUSTOMER_EMAIL:customer@example.com}
app.auth.seed.customer-password=${APP_SEED_CUSTOMER_PASSWORD:ChangeMe123!}
app.auth.seed.customer-full-name=${APP_SEED_CUSTOMER_FULL_NAME:Customer User}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT:5000}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Swagger UI only in local/dev
app.swagger.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.api-docs.enabled=${APP_SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${APP_SWAGGER_ENABLED:true}

# Actuator — health only for local probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized