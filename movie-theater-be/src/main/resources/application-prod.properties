# Production profile — tuned for throughput and observability
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=NasaFilmHikariPool

# Gzip response compression for JSON/API payloads
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Database schema safety validation in production
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.ignore-missing-migrations=true

# Never expose Swagger in production
app.swagger.enabled=false

# Actuator — health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Bảo mật webhook thanh toán: fail-closed nếu VIETQR_WEBHOOK_TOKEN chưa cấu hình
app.vietqr.webhook-require-token=${VIETQR_WEBHOOK_REQUIRE_TOKEN:true}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.com.thdpv.movietheater=INFO

# Stream cookie — bật Secure ở HTTPS; SameSite=None nếu FE và API khác host
app.vod.stream-cookie.secure=${VOD_STREAM_COOKIE_SECURE:true}
app.vod.stream-cookie.same-site=${VOD_STREAM_COOKIE_SAME_SITE:Lax}
app.vod.stream-cookie.domain=${VOD_STREAM_COOKIE_DOMAIN:.nasafilm.site}