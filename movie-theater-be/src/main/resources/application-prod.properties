# Production profile — tuned for throughput and observability
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=NasaFilmHikariPool

# Gzip response compression for JSON/API payloads
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Database schema safety validation in production
spring.jpa.hibernate.ddl-auto=validate

# Never expose Swagger in production
app.swagger.enabled=false

# Actuator — health only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
