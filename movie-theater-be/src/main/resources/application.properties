spring.application.name=movie-theater-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:movie_theater}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:sa123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET:ChangeThisToASecureJWTSecretKeyWithAtLeast32Chars!}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_EXPIRATION:604800000}

# Seed — Admin
app.auth.seed.admin-email=${APP_SEED_ADMIN_EMAIL:admin@example.com}
app.auth.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:123123}
app.auth.seed.admin-full-name=${APP_SEED_ADMIN_FULL_NAME:Admin User}

# Seed — Staff
app.auth.seed.staff-email=${APP_SEED_STAFF_EMAIL:staff@example.com}
app.auth.seed.staff-password=${APP_SEED_STAFF_PASSWORD:123123}
app.auth.seed.staff-full-name=${APP_SEED_STAFF_FULL_NAME:Staff User}

# Seed — Customer
app.auth.seed.customer-email=${APP_SEED_CUSTOMER_EMAIL:customer@example.com}
app.auth.seed.customer-password=${APP_SEED_CUSTOMER_PASSWORD:123123}
app.auth.seed.customer-full-name=${APP_SEED_CUSTOMER_FULL_NAME:Customer User}
