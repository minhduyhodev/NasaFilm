spring.application.name=movie-theater-backend


spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_EXPIRATION}

app.auth.seed.admin-email=${APP_SEED_ADMIN_EMAIL}
app.auth.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}
app.auth.seed.admin-full-name=${APP_SEED_ADMIN_FULL_NAME}
