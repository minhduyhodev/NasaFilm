spring.application.name=movie-theater-backend
server.tomcat.basedir=target/tomcat
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cache (Redis default; set app.cache.redis-enabled=false for in-memory Caffeine)
app.cache.redis-enabled=${REDIS_ENABLED:false}
app.cache.movies-ttl-minutes=10
app.cache.genres-ttl-minutes=15
app.cache.system-config-ttl-minutes=15
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration=${APP_JWT_ACCESS_EXPIRATION}
app.jwt.refresh-token-expiration=${APP_JWT_REFRESH_EXPIRATION}
app.google.client-id=${GOOGLE_WEB_CLIENT_ID}

# Seed - Admin
app.auth.seed.admin-email=${APP_SEED_ADMIN_EMAIL}
app.auth.seed.admin-password=${APP_SEED_ADMIN_PASSWORD}
app.auth.seed.admin-full-name=${APP_SEED_ADMIN_FULL_NAME}

# Seed - Staff
app.auth.seed.staff-email=${APP_SEED_STAFF_EMAIL}
app.auth.seed.staff-password=${APP_SEED_STAFF_PASSWORD}
app.auth.seed.staff-full-name=${APP_SEED_STAFF_FULL_NAME}

# Seed - Customer
app.auth.seed.customer-email=${APP_SEED_CUSTOMER_EMAIL}
app.auth.seed.customer-password=${APP_SEED_CUSTOMER_PASSWORD}
app.auth.seed.customer-full-name=${APP_SEED_CUSTOMER_FULL_NAME}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}

spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT}

# Frontend Config
app.frontend-url=${APP_FRONTEND_URL}
# Cloudinary Config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Showtime Config
app.showtime.auto-slide-enabled=false

# Scheduled maintenance (Spring cron: second minute hour day month weekday)
app.scheduler.finish-showtimes-cron=0 */5 * * * ?
app.scheduler.revoke-vod-cron=0 */10 * * * ?
app.scheduler.showtime-radar-cron=0 0 */6 * * ?

# Review moderation
app.review.auto-hide-report-threshold=3

# VOD / Streaming Config
app.vod.default-online-price=45000

# Payment: mock | vnpay | momo (future)
app.payment.provider=mock

# VietQR Config (MB Bank) — defaults match VietQRService @Value fallbacks
app.vietqr.bank-bin=${VIETQR_BANK_BIN:970422}
app.vietqr.account-no=${VIETQR_ACCOUNT_NO:6102005112233}
app.vietqr.account-name=${VIETQR_ACCOUNT_NAME:HO MINH DUY}
app.vietqr.bank-name=${VIETQR_BANK_NAME:MB Bank}
app.vietqr.template=${VIETQR_TEMPLATE:compact2}
app.vietqr.bank-logo=${VIETQR_BANK_LOGO:https://img.vietqr.io/img/MB.png}
app.vietqr.webhook-token=${VIETQR_WEBHOOK_TOKEN:}
# Bật ở prod (application-prod.properties) để từ chối webhook không xác thực khi thiếu token.
app.vietqr.webhook-require-token=${VIETQR_WEBHOOK_REQUIRE_TOKEN:false}


# Database Seeding Switch (set to false to disable seeding)
app.seed.enabled=false
# Wallet top-up: mock (instant) | stripe (PaymentIntent + confirm/webhook)
app.wallet.top-up-provider=mock
app.wallet.default-balance=1000000
app.wallet.seed-demo-balance=false
app.wallet.min-top-up=10000
app.wallet.max-top-up=10000000
app.wallet.quick-amounts=100000,200000,500000,1000000

app.missions.orbit-seat-enabled=true
app.orbit.enabled=true
app.orbit.room.ttl-minutes=30
app.orbit.checkout.ttl-minutes=15
app.orbit.expire-check-ms=60000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-description=Legacy schema from Hibernate ddl-auto and FeatureSchemaMigrationConfig

app.pre-show.enabled=true
app.pre-show.notify-minutes-before=60
app.pre-show.boarding-soon-minutes=15
app.pre-show.scheduler-window-minutes=5
app.scheduler.pre-show-cron=0 * * * * ?


stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.publishable-key=${VITE_STRIPE_PUBLISHABLE_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
api.key=${API_KEY}

# S3 media — DB lưu key (movie/..); poster/trailer qua /api/media/border; phim qua /api/media/stream + token
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:https://java-06.s3.ap-southeast-1.amazonaws.com}
app.s3.bucket=${AWS_S3_BUCKET}
app.s3.region=${AWS_REGION}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY}
# Upload admin bật khi có AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (AwsS3Config)
app.s3.presign-ttl-seconds=${AWS_S3_PRESIGN_TTL:3600}
app.s3.multipart-part-size-bytes=${AWS_S3_MULTIPART_PART_SIZE:16777216}

# Groq Support Bot (OpenAI-compatible API; status API returns mode=AI)
app.groq.api-key=${APP_GROQ_API_KEY}
app.groq.model=${APP_GROQ_MODEL}
app.groq.api-url=${APP_GROQ_API_URL}

# TMDB (optional) — person search for actor avatar enrichment
app.tmdb.api-key=${APP_TMDB_API_KEY:}

# Auto-fetch missing actor avatars from TMDB/Wikipedia on startup
app.actor.enrich-avatars-on-startup=${APP_ACTOR_ENRICH_AVATARS_ON_STARTUP:true}

# Swagger disabled by default (enable in application-dev.properties)
app.swagger.enabled=${APP_SWAGGER_ENABLED:false}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true