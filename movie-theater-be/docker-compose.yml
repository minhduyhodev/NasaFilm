version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-backend
    # Removed ports 8080:8080 because Caddy will proxy it internally
    restart: always
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    depends_on:
      - redis

  caddy:
    image: caddy:2-alpine
    container_name: movie-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: caddy reverse-proxy --from api.nasafilm.site --to backend:8080
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: movie-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
  caddy_data:
  caddy_config:
